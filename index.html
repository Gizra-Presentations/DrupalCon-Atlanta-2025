<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

	<title>reveal.js + Prism</title>

	<link rel="stylesheet" href="dist/reset.css">
	<link rel="stylesheet" href="dist/reveal.css">
	<link rel="stylesheet" href="dist/theme/black.css">

	<!-- Prism.js theme (you can change this to any other Prism theme) -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1/themes/prism-tomorrow.css">

	<!-- Optional: line numbers plugin -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1/plugins/line-numbers/prism-line-numbers.css">
</head>

<body>
	<div class="reveal">
		<div class="slides">
			<section data-markdown="slides.md" data-separator="^---$" data-separator-vertical="^\|\|\|$"
				data-separator-notes="^Note:">
			</section>
		</div>
	</div>

	<!-- Reveal core and plugins -->
	<script src="dist/reveal.js"></script>
	<script src="plugin/notes/notes.js"></script>
	<script src="plugin/markdown/markdown.js"></script>

	<!-- Prism.js core -->
	<script src="https://cdn.jsdelivr.net/npm/prismjs@1/prism.min.js"></script>
	<!-- Prism: PHP language -->
	<script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-php.min.js"></script>
	<!-- Optional: line numbers -->
	<script src="https://cdn.jsdelivr.net/npm/prismjs@1/plugins/line-numbers/prism-line-numbers.min.js"></script>

	<script>
		Reveal.initialize({
			hash: true,
			plugins: [RevealMarkdown, RevealNotes]
		});

		// Prism highlight after markdown is rendered
		Reveal.on('ready', () => {
			Prism.highlightAll();
		});
	</script>

</body>

</html>
